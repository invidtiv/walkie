name: Publish to npm

# Publishing happens on a version tag, via npm trusted publishing (OIDC).
# No NPM_TOKEN and no 2FA one-time code: npm verifies the workflow's identity
# from the OIDC claim, so nothing secret is stored in this repo.
#
# Requires a Trusted Publisher configured on npmjs.com for walkie-sh:
#   organization/user : vikasprogrammer
#   repository        : walkie
#   workflow filename : publish.yml
#   allowed actions   : npm publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # lets the runner mint the OIDC token npm authenticates against
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show toolchain
        run: node -v && npm -v

      - name: Tag must match package.json version
        # A tag that disagrees with package.json publishes the wrong version
        # under the right name, which cannot be undone. Fail before publishing.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; }

      - run: npm ci

      - run: npm test

      - run: npm publish
